<style>
/* Riva, hrvatski: an editorial look on warm stone paper. Fraunces serif for headlines and Croatian words, Instrument Sans for the interface,
   Adriatic navy ink with roof-tile terracotta. Croatian motifs each have a job: the šahovnica board shows lesson progress, the licitar heart
   counts streaks and rewards, pleter knotwork divides sections, red vez cross-stitch marks success, and stories open with a Glagolitic initial.
   Top-level views share a floating tab bar; exercise sessions are full screen with a feedback card docked to the bottom. */
:root {
  --bg: #f5f0e6;
  --surface: #fffdf8;
  --surface-2: #efe8da;
  --ink: #13233a;
  --muted: #6b675b;
  --line: #e3d9c6;
  --cta: #13233a;
  --cta-ink: #f5f0e6;
  --sea: #2d6a8a;
  --sea-ink: #ffffff;
  --sea-soft: #e1ebef;
  --red: #b04a31;
  --terra: #c4553b;
  --lic: #b3262e;
  --checker-light: #fffdf8;
  --good: #56703a;
  --good-soft: #e8eddd;
  --bad: #b3262e;
  --bad-soft: #f6e1dd;
  --sun: #e0a93b;
  --p1: #f0e4d4; --p2: #f3e8cf; --p3: #e2ebee; --p4: #e8eddd; --p5: #ebe5ef; --p6: #f6e1dd;
  --art-tile: #f0e4d4;
  --scene-dim: 1;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a28; --surface: #18263a; --surface-2: #22324a; --ink: #f2ebdd; --muted: #a9a497; --line: #2b3b52;
    --cta: #f2ebdd; --cta-ink: #13233a; --sea: #8cc0da; --sea-ink: #0b1b2b; --sea-soft: #1b3044; --red: #ec9479; --terra: #e07a5f; --lic: #d8434b; --checker-light: #18263a;
    --good: #a9c47f; --good-soft: #1f2e1f; --bad: #f08a80; --bad-soft: #3a1d1d; --sun: #e9b95a;
    --p1: #2a2a2e; --p2: #2c2a24; --p3: #1d2c3c; --p4: #212d24; --p5: #272637; --p6: #2f2228; --art-tile: #e9dfcc; --scene-dim: .86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a28; --surface: #18263a; --surface-2: #22324a; --ink: #f2ebdd; --muted: #a9a497; --line: #2b3b52;
  --cta: #f2ebdd; --cta-ink: #13233a; --sea: #8cc0da; --sea-ink: #0b1b2b; --sea-soft: #1b3044; --red: #ec9479; --terra: #e07a5f; --lic: #d8434b; --checker-light: #18263a;
  --good: #a9c47f; --good-soft: #1f2e1f; --bad: #f08a80; --bad-soft: #3a1d1d; --sun: #e9b95a;
  --p1: #2a2a2e; --p2: #2c2a24; --p3: #1d2c3c; --p4: #212d24; --p5: #272637; --p6: #2f2228; --art-tile: #e9dfcc; --scene-dim: .86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.1; letter-spacing: -.015em; margin: 0; text-wrap: balance; font-variation-settings: "opsz" 72; }
h2 { font-size: 1.4rem; }
p { margin: 0; }

/* Icons: one 24px line set; .art is a kids' picture */
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }
.ic.solid { fill: currentColor; }
.art { width: 1em; height: 1em; display: inline-block; vertical-align: -.15em; flex: none; }
.emo { line-height: 1; }
.licitar { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.25em; }
.glag { font-family: "Noto Sans Glagolitic", serif; }
.kicker { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.kicker i { font-style: normal; opacity: .75; }
.pleter { display: block; width: 100%; height: 18px; color: var(--terra); }
.vez { display: block; height: 30px; width: 100%; color: var(--lic); }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

/* Header: italic wordmark with a small šahovnica, learner chip on the right */
.top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.checker { width: 22px; height: 22px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px var(--line);
  background: conic-gradient(var(--terra) 25%, var(--checker-light) 0 50%, var(--terra) 0 75%, var(--checker-light) 0) 0 0 / 11px 11px; }
.brand h1 { font-size: 1.35rem; font-weight: 500; font-style: italic; letter-spacing: -.01em; }
.brand small { display: block; font-size: .72rem; color: var(--muted); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.chip { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 14px 3px 3px; font-weight: 500; max-width: 55%; min-height: 46px; }
.chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; flex: none; }
.hello { font-size: clamp(2.4rem, 11vw, 3rem); font-weight: 340; line-height: 1.02; letter-spacing: -.03em; padding: 4px 2px 0; font-variation-settings: "opsz" 144; }
.hello em { color: var(--terra); }
.hello .kicker { display: block; font-family: var(--font-body); letter-spacing: .14em; margin-bottom: 8px; }

.btn { border: 1px solid var(--line); border-radius: 16px; padding: 12px 20px; font-weight: 600; background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; text-align: center; }
.btn.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.btn.primary:active, .btn:active { transform: scale(.985); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: .9rem; border-radius: 12px; }
.panel .btn:not(.primary), .hero-card .btn:not(.primary) { background: var(--bg); }
.linkbtn { background: none; border: 0; color: var(--sea); font-weight: 600; padding: 4px 0; display: inline-flex; align-items: center; gap: 6px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.today { display: grid; gap: 16px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.today-head h2 { font-size: 1.5rem; }
.stats { display: flex; gap: 8px 16px; flex-wrap: wrap; color: var(--muted); font-weight: 400; font-size: .95rem; }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.goal { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.goal i { display: block; height: 100%; background: var(--cta); border-radius: 99px; transition: width .4s; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 200px; }

/* Šahovnica board: each step of the lesson fills one square, alternating rows, so a finished day is a checker band */
.cboard { display: grid; grid-auto-flow: column; grid-template-rows: 1fr 1fr; height: 30px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); flex: 1; min-width: 0; }
.cboard i { border-right: 1px solid var(--line); } .cboard i:nth-last-child(-n+2) { border-right: 0; }
.cboard i.on { background: var(--terra); }
.cboard i.now { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--terra) 40%, transparent) 0 3px, transparent 3px 6px); }
.cboard.big { height: 46px; border-radius: 8px; width: 100%; }
.boardrow { display: flex; align-items: center; gap: 12px; }
.boardrow .kicker { white-space: nowrap; }

/* Home: today's lesson on the day's landmark */
.hero-card { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 6px; display: grid; }
.scene { height: 250px; border-radius: 21px; position: relative; overflow: hidden; filter: brightness(var(--scene-dim));
  background: linear-gradient(#dce7e4 0%, #dce7e4 55%, #8db3c4 56%, #2d6a8a 100%); }
.scene .sun { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: #e0a93b; right: 44px; top: 26px; }
.scene .isl { position: absolute; top: 98px; left: -24px; width: 230px; height: 42px; background: #efe6d6; border-radius: 4px; }
.scene .town { position: absolute; top: 86px; left: 26px; display: flex; gap: 4px; align-items: flex-end; height: 54px; }
.scene .town b { display: block; width: 18px; background: #fffdf8; border-top: 7px solid #c4553b; }
.scene .boat { position: absolute; left: 58%; bottom: 34px; width: 54px; height: 54px; color: #13233a; }
.scene.photo { background: #6f8f9f center / cover no-repeat; }
.scene.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,20,35,.82), rgba(10,20,35,.25) 50%, rgba(10,20,35,0) 72%); }
.scene .lmcap { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 1; color: #fff; display: grid; line-height: 1.15; }
.scene .lmcap .kicker { color: rgba(255,255,255,.8); }
.scene .lmcap b { font-family: var(--font-display); font-size: 1.85rem; font-weight: 400; letter-spacing: -.02em; margin-top: 4px; }
.scene .lmcap span { font-size: .9rem; opacity: .88; }
.scene.photo .tagpill { top: 12px; bottom: auto; z-index: 1; }
.lmcredit { display: inline-flex; gap: 4px; align-items: center; margin-top: 4px; font-size: .72rem; color: var(--muted); text-decoration: none; }
.lmcredit:hover { text-decoration: underline; }
.lmfact { font-size: .92rem; color: var(--muted); line-height: 1.5; }
.lmfact b { color: var(--ink); font-weight: 600; }
.scene .tagpill { position: absolute; left: 12px; bottom: 12px; background: rgba(255,253,248,.88); color: #13233a; border-radius: 999px; padding: 5px 12px 5px 8px; font-size: .8rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; backdrop-filter: blur(6px); }
.hero-body { padding: 16px 14px 14px; display: grid; gap: 14px; }
.hero-body .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-body .t h2 { font-size: 1.7rem; font-weight: 360; }
.hero-body .pctbig { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
.hero-body .pctbig small { display: block; font-family: var(--font-body); font-size: .72rem; font-weight: 500; color: var(--muted); letter-spacing: 0; text-align: right; margin-top: 4px; }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; padding-inline: 4px; }
.section-head p { color: var(--muted); font-size: .9rem; }
.eyebrow { font-size: .8rem; font-weight: 500; color: var(--muted); }

.practice { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 16px; display: grid; gap: 2px; align-content: start; }
.tile .ic { width: 44px; height: 44px; padding: 10px; border-radius: 50%; background: var(--p1); margin-bottom: 10px; stroke-width: 1.5; }
.tile:nth-child(6n+2) .ic { background: var(--p2); } .tile:nth-child(6n+3) .ic { background: var(--p3); } .tile:nth-child(6n+4) .ic { background: var(--p4); } .tile:nth-child(6n+5) .ic { background: var(--p5); } .tile:nth-child(6n) .ic { background: var(--p6); }
.tile b { font-family: var(--font-display); font-weight: 450; font-size: 1.12rem; }
.tile small { color: var(--muted); font-size: .85rem; }
.tile:hover, .topic:hover { border-color: var(--ink); }

.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.topic { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px 14px; display: grid; gap: 6px; }
.topic .pic { font-size: 2.6rem; line-height: 1; height: 84px; border-radius: 16px; display: grid; place-items: center; background: var(--p3); }
.topic:nth-child(6n+2) .pic { background: var(--p2); } .topic:nth-child(6n+3) .pic { background: var(--p4); } .topic:nth-child(6n+4) .pic { background: var(--p1); } .topic:nth-child(6n+5) .pic { background: var(--p5); } .topic:nth-child(6n) .pic { background: var(--p6); }
.topic b, .topic small, .topic .bar, .topic .count { margin-inline: 6px; }
.topic b { font-family: var(--font-display); font-weight: 450; font-size: 1.15rem; }
.topic small { color: var(--muted); font-size: .85rem; }
.bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--terra); border-radius: 99px; }
.count { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); font-weight: 500; }

.board { display: grid; gap: 4px; }
.board-row { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.board-row:last-child { border-bottom: 0; }
.board-row .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row .num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.board-row .sub { color: var(--muted); font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; display: inline-flex; gap: 4px; align-items: center; }

.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; font-size: .92rem; color: var(--muted); }
.notice b { display: block; color: var(--ink); font-weight: 600; }

/* Floating tab bar: the current tab gets a tiny šahovnica under its label */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px; display: flex; justify-content: space-around; gap: 4px; z-index: 6; box-shadow: 0 10px 30px rgba(19,35,58,.10); }
.tabbar button { flex: 1 1 0; max-width: 96px; height: 58px; border: 0; border-radius: 16px; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: .7rem; font-weight: 500; position: relative; }
.tabbar button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabbar button[aria-current="page"]::after { content: ""; position: absolute; bottom: 3px; width: 6px; height: 6px; background: conic-gradient(var(--terra) 0 25%, transparent 0 50%, var(--terra) 0 75%, transparent 0); }

/* Sub views */
.subhead { display: flex; align-items: center; gap: 12px; }
.subhead h2 { font-size: 1.8rem; font-weight: 380; display: flex; align-items: center; gap: 10px; }
.back { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); flex: none; display: grid; place-items: center; }
.wordlist { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; }
.wordrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wordrow:last-child { border-bottom: 0; }
.wordrow .p { font-size: 2rem; text-align: center; display: grid; place-items: center; }
.wordrow .hr { font-family: var(--font-display); font-weight: 450; font-size: 1.2rem; }
.wordrow .en { color: var(--muted); font-size: .9rem; }
.wordrow .note { color: var(--muted); font-size: .82rem; font-style: italic; }
.say { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--cta); color: var(--cta-ink); flex: none; display: grid; place-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: transparent; box-shadow: inset 0 0 0 1px var(--muted); margin-right: 8px; vertical-align: middle; }
.dot.on { background: var(--good); box-shadow: none; }

/* Session */
.session { min-height: 100%; display: flex; flex-direction: column; }
.sbar { display: flex; align-items: center; gap: 12px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 760px; width: 100%; margin: 0 auto; }
.sbar .goal { flex: 1; height: 4px; }
.close { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: none; display: grid; place-items: center; }
.stage { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 200px; display: flex; flex-direction: column; gap: 16px; }
.prompt-label { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.steplabel { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); align-self: flex-start; padding: 2px 0; }
.daily { display: grid; gap: 12px; justify-items: stretch; }
.daily > .btn { width: 100%; }
.plan { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; position: relative; color: var(--ink); font-size: .95rem; }
.plan::before { content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 1px; background: var(--line); }
.plan li { display: grid; grid-template-columns: 31px 1fr; gap: 12px; align-items: center; position: relative; line-height: 1.35; }
.plan li .ic { width: 31px; height: 31px; padding: 7px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.plan b { color: var(--ink, inherit); }
.rulecard { text-align: left; justify-items: stretch; }
.card.rulecard p, .card.rulecard .steptitle { text-align: left; }
.card.rulecard p, .rule .step p { white-space: pre-line; }
.steptitle { font-family: var(--font-display); font-size: 1.3rem; font-weight: 450; margin: 4px 0 0; }
.worked { background: var(--bg); border-radius: 14px; padding: 10px 14px; border-left: 3px solid var(--terra); }
.worked p { margin: 4px 0 0; }
.rule .step { display: grid; gap: 6px; margin-bottom: 14px; }
.why { margin-top: 6px; font-weight: 500; }
.writebox { min-height: 4.5em; resize: vertical; font: inherit; }
.writeout { display: grid; gap: 10px; text-align: left; }
.writeout .said { font-family: var(--font-display); font-size: 1.3rem; font-weight: 450; line-height: 1.6; }
.writeout .said .bad { text-decoration: underline wavy var(--bad, #c0392b); text-underline-offset: 4px; }
.writeout ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.writeout .later { color: var(--muted); }
.helprow { display: grid; gap: 4px; justify-items: center; }
.helprow .hint { letter-spacing: .08em; font-weight: 600; }
.big { font-family: var(--font-display); font-weight: 380; font-size: clamp(2.3rem, 10vw, 3.2rem); letter-spacing: -.03em; line-height: 1.05; overflow-wrap: anywhere; font-variation-settings: "opsz" 144; }
.bigpic { font-size: clamp(5rem, 26vw, 7rem); line-height: 1; text-align: center; display: grid; place-items: center; }
.bigpic .ic { stroke-width: 1.1; color: var(--terra); }
/* Answers hidden until revealed must stay hidden even on elements whose class or inline style sets display. */
[hidden] { display: none !important; }

  // ---------- sessions ----------

        ? (planOf(p).check?.[s.checked.unit] ? "It stuck. It comes back for another check in " + (planOf(p).check[s.checked.unit].due - today()) + " days." : "It stuck. That was its last check-up.")
        : "It hasn't stuck yet, so it comes back into the daily lesson tomorrow, explained step by step again.") }) : null,
      s.kind === "daily" && s.slow ? h("p", { text: "Grammar: your answers were right, but " + (s.speed[1] - s.speed[0]) + " of " + s.speed[1] + " were slow, so today doesn't count as a clean day for " + GRAM[s.unit].en.split(":")[0] + " yet. It moves on after two days that are right and quick." }) : null,
      s.kind === "daily" ? h("p", { text: ([...s.relearn, ...s.fresh].length ? "Tomorrow starts by asking for " + [...s.relearn, ...s.fresh].map(id => BY_ID[id].hr).join(", ") + " from memory. New words unlock only if they all come back. " : "") + "The next lesson opens tomorrow." }) : null,
      s.kind === "lesson" && s.fresh.length ? h("p", { text: "New words: " + s.fresh.map(id => BY_ID[id].hr).join(", ") + ". They'll come back for review tomorrow." }) : null,
      h("div", { class: "actions", style: "width:100%" },
        s.kind === "match" ? h("button", { class: "btn primary", onclick: () => { session = null; startMatch(); } }, "Play again") : null,
        s.next ? h("button", { class: "btn primary", onclick: () => { session = null; s.next[1](); } }, s.next[0]) : null,
        h("button", { class: "btn", onclick: () => go("home") }, "Home"))));
  }

  document.addEventListener("keydown", e => {
    if (!session) return;
    if (e.key === "Enter" && document.activeElement?.id !== "typed") { const c = $("#continue"); if (c && document.activeElement !== c) { e.preventDefault(); c.click(); } }
  });

  render();
  // Fetch the audio packs in the background so taps play straight away.
  if (PACKED) setTimeout(() => PACKED.packs.reduce((ch, p) => ch.then(() => loadPack(p)), Promise.resolve()), 800);
})();
</script>
