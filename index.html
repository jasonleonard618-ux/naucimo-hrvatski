<style>
/* Layout: one mobile-first column on a soft grey ground. White pill and circle controls, black for the one main action, big light headlines.
   Top-level views share a floating tab bar; exercise sessions are full screen with a feedback card docked to the bottom. */
:root {
  --bg: #e9e9e6;
  --surface: #ffffff;
  --surface-2: #f2f2ef;
  --ink: #121212;
  --muted: #6f6f6a;
  --line: #e1e1dc;
  --cta: #121212;
  --cta-ink: #ffffff;
  --sea: #1f6fb2;
  --sea-ink: #ffffff;
  --sea-soft: #e3eef8;
  --red: #e03a3e;
  --checker-light: #ffffff;
  --good: #1d7f47;
  --good-soft: #e1f3e7;
  --bad: #c0392b;
  --bad-soft: #fbe5e2;
  --sun: #f2b84b;
  --p1: #ffe1dc; --p2: #fff0c7; --p3: #dcebfb; --p4: #dff3e4; --p5: #ece3fb; --p6: #fde3ef;
  --scene-dim: 1;
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f10; --surface: #1c1c1e; --surface-2: #29292c; --ink: #f2f2f0; --muted: #9d9d98; --line: #303033;
    --cta: #f2f2f0; --cta-ink: #121212; --sea: #6cb4f0; --sea-ink: #0b1b2b; --sea-soft: #1a2c3d; --red: #ff5b60; --checker-light: #f2f2f0;
    --good: #4fcf88; --good-soft: #15301f; --bad: #ff7a6e; --bad-soft: #3a1d1a; --sun: #f5c451;
    --p1: #3a2422; --p2: #3a321c; --p3: #1c2c3d; --p4: #1c3324; --p5: #2b2440; --p6: #3a2230; --scene-dim: .82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f10; --surface: #1c1c1e; --surface-2: #29292c; --ink: #f2f2f0; --muted: #9d9d98; --line: #303033;
  --cta: #f2f2f0; --cta-ink: #121212; --sea: #6cb4f0; --sea-ink: #0b1b2b; --sea-soft: #1a2c3d; --red: #ff5b60; --checker-light: #f2f2f0;
  --good: #4fcf88; --good-soft: #15301f; --bad: #ff7a6e; --bad-soft: #3a1d1a; --sun: #f5c451;
  --p1: #3a2422; --p2: #3a321c; --p3: #1c2c3d; --p4: #1c3324; --p5: #2b2440; --p6: #3a2230; --scene-dim: .82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.12; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.35rem; }
p { margin: 0; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(120px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

/* Header: brand circle with the šahovnica, learner pill on the right */
.top { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.checker { width: 48px; height: 48px; border-radius: 50%; flex: none; border: 9px solid var(--surface);
  background: conic-gradient(var(--red) 25%, var(--checker-light) 0 50%, var(--red) 0 75%, var(--checker-light) 0) 0 0 / 15px 15px; }
.brand h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; }
.brand small { display: block; font-size: .8rem; color: var(--muted); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: 10px; border: 0; background: var(--surface); border-radius: 999px; padding: 4px 16px 4px 4px; font-weight: 500; max-width: 55%; min-height: 48px; }
.chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: .95rem; flex: none; }
.hello { font-size: clamp(2.1rem, 9vw, 2.7rem); line-height: 1.05; padding: 6px 4px 0; }

.btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 500; background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; text-align: center; }
.btn.primary { background: var(--cta); color: var(--cta-ink); }
.btn.primary:active { transform: scale(.98); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 40px; padding: 6px 16px; font-size: .9rem; }
.panel .btn:not(.primary), .hero-card .btn:not(.primary) { background: var(--surface-2); }
.linkbtn { background: none; border: 0; color: var(--sea); font-weight: 500; padding: 4px 0; }

.panel { background: var(--surface); border: 0; border-radius: var(--radius); padding: 20px; }
.today { display: grid; gap: 16px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.today-head h2 { font-size: 1.5rem; }
.stats { display: flex; gap: 8px 16px; flex-wrap: wrap; color: var(--muted); font-weight: 400; font-size: .95rem; }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.goal { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.goal i { display: block; height: 100%; background: var(--cta); border-radius: 99px; transition: width .4s; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 200px; }

/* Home: today's lesson as one big card with a picture on top */
.hero-card { background: var(--surface); border-radius: 34px; padding: 6px; display: grid; }
.scene { height: 210px; border-radius: 29px; position: relative; overflow: hidden; filter: brightness(var(--scene-dim));
  background: linear-gradient(#f7d9b8 0%, #f3c1a0 40%, #9fd0e6 41%, #5aa7cf 72%, #2f7fb0 100%); }
.scene .sun { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #fff3d6; left: 44px; top: 18px; box-shadow: 0 0 40px #ffe7b3; }
.scene .isl { position: absolute; top: 46px; right: -24px; width: 210px; height: 32px; background: #6f8f6a; border-radius: 120px 120px 0 0; }
.scene .town { position: absolute; top: 44px; right: 34px; display: flex; gap: 3px; align-items: flex-end; height: 34px; }
.scene .town b { display: block; width: 14px; background: #f1e4cf; border-top: 5px solid #d0623f; }
.scene .boat { position: absolute; left: 46%; bottom: 30px; font-size: 34px; line-height: 1; }
.scene.photo { background: #6f8f9f center / cover no-repeat; }
.scene.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.25) 45%, rgba(0,0,0,0) 70%); }
.scene .lmcap { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; color: #fff; display: grid; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.scene .lmcap b { font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; }
.scene .lmcap span { font-size: .85rem; opacity: .9; }
.scene.photo .tagpill { top: 12px; bottom: auto; z-index: 1; }
.lmcredit { display: block; margin-top: 4px; font-size: .72rem; color: var(--muted); text-decoration: none; }
.lmcredit:hover { text-decoration: underline; }
.lmfact { font-size: .9rem; color: var(--muted); }
.lmfact b { color: var(--ink); font-weight: 600; }
.scene .tagpill { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.78); color: #121212; border-radius: 999px; padding: 6px 14px; font-size: .85rem; font-weight: 600; }
.hero-body { padding: 16px 14px 14px; display: grid; gap: 14px; }
.hero-body .t { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-body .t h2 { font-size: 1.5rem; }
.hero-body .pctbig { font-weight: 700; font-size: 1.7rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-body .pctbig small { display: block; font-size: .75rem; font-weight: 500; color: var(--muted); letter-spacing: 0; text-align: right; }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; padding-inline: 4px; }
.section-head p { color: var(--muted); font-size: .9rem; }
.eyebrow { font-size: .8rem; font-weight: 500; color: var(--muted); }

.practice { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius); padding: 8px 8px 14px; display: grid; gap: 2px; align-content: start; }
.tile .ic { font-size: 1.7rem; line-height: 1; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--p1); margin-bottom: 8px; }
.tile:nth-child(6n+2) .ic { background: var(--p2); } .tile:nth-child(6n+3) .ic { background: var(--p3); } .tile:nth-child(6n+4) .ic { background: var(--p4); } .tile:nth-child(6n+5) .ic { background: var(--p5); } .tile:nth-child(6n) .ic { background: var(--p6); }
.tile b, .tile small { padding-inline: 6px; }
.tile b { font-weight: 600; font-size: 1rem; }
.tile small { color: var(--muted); font-size: .85rem; }
.tile:hover, .topic:hover { box-shadow: 0 0 0 2px var(--ink); }

.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.topic { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius); padding: 8px 8px 14px; display: grid; gap: 6px; }
.topic .pic { font-size: 2rem; line-height: 1; height: 72px; border-radius: 20px; display: grid; place-items: center; background: var(--p3); }
.topic:nth-child(6n+2) .pic { background: var(--p2); } .topic:nth-child(6n+3) .pic { background: var(--p4); } .topic:nth-child(6n+4) .pic { background: var(--p1); } .topic:nth-child(6n+5) .pic { background: var(--p5); } .topic:nth-child(6n) .pic { background: var(--p6); }
.topic b, .topic small, .topic .bar, .topic .count { margin-inline: 6px; }
.topic b { font-weight: 600; font-size: 1.05rem; }
.topic small { color: var(--muted); font-size: .85rem; }
.bar { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cta); border-radius: 99px; }
.count { font-variant-numeric: tabular-nums; font-size: .8rem; color: var(--muted); font-weight: 500; }

.board { display: grid; gap: 4px; }
.board-row { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.board-row:last-child { border-bottom: 0; }
.board-row .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row .num { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.board-row .sub { color: var(--muted); font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }

.notice { background: var(--surface); border-radius: 22px; padding: 14px 18px; font-size: .92rem; color: var(--muted); }
.notice b { display: block; color: var(--ink); font-weight: 600; }

/* Floating tab bar */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 999px; padding: 8px; display: flex; justify-content: center; gap: 8px; z-index: 6; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.tabbar button { flex: 1 1 0; max-width: 92px; height: 56px; border: 0; border-radius: 999px; background: var(--surface-2); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .7rem; font-weight: 500; }
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { background: var(--cta); color: var(--cta-ink); }

/* Sub views */
.subhead { display: flex; align-items: center; gap: 12px; }
.subhead h2 { font-size: 1.6rem; }
.back { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--surface); font-size: 1.2rem; flex: none; }
.wordlist { display: grid; gap: 0; background: var(--surface); border-radius: var(--radius); padding: 4px 16px; }
.wordrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wordrow:last-child { border-bottom: 0; }
.wordrow .p { font-size: 1.5rem; text-align: center; }
.wordrow .hr { font-weight: 600; font-size: 1.05rem; }
.wordrow .en { color: var(--muted); font-size: .9rem; }
.wordrow .note { color: var(--muted); font-size: .82rem; font-style: italic; }
.say { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--cta); color: var(--cta-ink); font-size: 1rem; flex: none; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); margin-right: 6px; vertical-align: middle; }
.dot.on { background: var(--good); box-shadow: none; }

/* Session */
.session { min-height: 100%; display: flex; flex-direction: column; }
.sbar { display: flex; align-items: center; gap: 10px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 760px; width: 100%; margin: 0 auto; }
.sbar .goal { flex: 1; height: 48px; border-radius: 999px; background: linear-gradient(var(--surface-2), var(--surface-2)) center / calc(100% - 36px) 6px no-repeat, var(--surface); padding: 0 18px; display: flex; align-items: center; }
.sbar .goal i { height: 6px; border-radius: 9px; background: var(--cta); box-shadow: 0 0 0 0 transparent; }
.close { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--surface); font-size: 1.1rem; color: var(--ink); flex: none; }
.stage { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 200px; display: flex; flex-direction: column; gap: 16px; }
.prompt-label { font-weight: 500; color: var(--muted); font-size: .95rem; }
.steplabel { font-size: .8rem; font-weight: 500; color: var(--muted); background: var(--surface); border-radius: 999px; padding: 6px 14px; align-self: flex-start; }
.daily { display: grid; gap: 10px; justify-items: stretch; }
.daily > .btn { width: 100%; }
.plan { margin: 4px 0 0; padding-left: 1.3em; display: grid; gap: 4px; color: var(--muted); font-size: .95rem; }
.plan b { color: var(--ink, inherit); }
.rulecard { text-align: left; justify-items: stretch; }
.card.rulecard p, .card.rulecard .steptitle { text-align: left; }
.card.rulecard p, .rule .step p { white-space: pre-line; }
.steptitle { font-size: 1.05rem; font-weight: 700; margin: 4px 0 0; }
.worked { background: var(--bg); border-radius: 18px; padding: 10px 14px; }
.worked p { margin: 4px 0 0; }
.rule .step { display: grid; gap: 6px; margin-bottom: 14px; }
.why { margin-top: 6px; font-weight: 500; }
.writebox { min-height: 4.5em; resize: vertical; font: inherit; }
.writeout { display: grid; gap: 10px; text-align: left; }
.writeout .said { font-size: 1.15rem; font-weight: 600; line-height: 1.6; }
.writeout .said .bad { text-decoration: underline wavy var(--bad, #c0392b); text-underline-offset: 4px; }
.writeout ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.writeout .later { color: var(--muted); }
.helprow { display: grid; gap: 4px; justify-items: center; }
.helprow .hint { letter-spacing: .08em; font-weight: 600; }
.big { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: -.03em; line-height: 1.1; overflow-wrap: anywhere; }
.bigpic { font-size: clamp(4rem, 18vw, 6rem); line-height: 1; text-align: center; }
/* Answers hidden until revealed must stay hidden even on elements whose class or inline style sets display. */
[hidden] { display: none !important; }
.card { background: var(--surface); border: 0; border-radius: 30px; padding: 24px 20px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.card .en { color: var(--muted); font-size: 1.15rem; font-weight: 500; }
.card .note { color: var(--muted); font-size: .92rem; font-style: italic; max-width: 40ch; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.center { justify-content: center; }
.playbig { width: 92px; height: 92px; border-radius: 50%; border: 0; background: var(--cta); color: var(--cta-ink); font-size: 2.2rem; margin: 8px auto; display: grid; place-items: center; }
.playbig:active { transform: scale(.96); }
.options { display: grid; gap: 10px; }
.opt { text-align: left; background: var(--surface); border: 0; box-shadow: inset 0 0 0 2px transparent; border-radius: 22px; padding: 14px 20px; font-weight: 500; font-size: 1.05rem; min-height: 60px; }
.opt:hover:not(:disabled) { box-shadow: inset 0 0 0 2px var(--ink); }
.opt.right { box-shadow: inset 0 0 0 2px var(--good); background: var(--good-soft); }
.opt.wrong { box-shadow: inset 0 0 0 2px var(--bad); background: var(--bad-soft); }
.picopts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.picopt { background: var(--p1); border: 6px solid var(--surface); border-radius: 30px; font-size: clamp(3rem, 14vw, 4.5rem); aspect-ratio: 1.15; max-width: 100%; display: grid; place-items: center; position: relative; }
.picopt:nth-child(4n+2) { background: var(--p2); } .picopt:nth-child(4n+3) { background: var(--p3); } .picopt:nth-child(4n) { background: var(--p4); }
.picopt.right { box-shadow: 0 0 0 3px var(--good); }
.picopt.right::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--good); color: #fff; font-size: 15px; font-weight: 700; display: grid; place-items: center; }
.picopt.wrong { box-shadow: 0 0 0 3px var(--bad); opacity: .7; }
.typebox { width: 100%; font: inherit; font-size: 1.3rem; padding: 16px 20px; border-radius: 22px; border: 0; box-shadow: inset 0 0 0 2px var(--line); background: var(--surface); color: var(--ink); }
.typebox:focus { box-shadow: inset 0 0 0 2px var(--ink); outline: none; }
.keys { display: flex; gap: 8px; flex-wrap: wrap; }
.key { min-width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--surface); font-size: 1.15rem; font-weight: 600; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate .btn { flex-direction: column; gap: 0; padding: 8px 4px; font-size: .9rem; border-radius: 22px; }
.rate .btn small { font-weight: 400; color: inherit; opacity: .75; font-size: .75rem; }
.rate .again { background: var(--bad-soft); color: var(--bad); }
.rate .good { background: var(--good-soft); color: var(--good); }

.sheet { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; background: var(--surface); border-radius: 30px; padding: 16px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.14); }
.sheet .in { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
.sheet.good { background: var(--good-soft); }
.sheet.bad { background: var(--bad-soft); }
.sheet .msg { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; letter-spacing: -.01em; }
.sheet.good .msg { color: var(--good); }
.sheet.bad .msg { color: var(--bad); }
.sheet .detail { font-weight: 500; }
.sheet .btn { width: 100%; }

.done { text-align: center; display: grid; gap: 16px; justify-items: center; padding-top: 32px; }
.done .bigpic { font-size: 5rem; }
.done .stats { justify-content: center; }

/* Reading */
.story { font-size: 1.3rem; line-height: 1.9; background: var(--surface); border-radius: var(--radius); padding: 20px; }

<script>
(() => {
  const C = window.COURSE;
  const COLORS = ["#0b5394", "#d01c2b", "#1d7f47", "#8a4fbf", "#c46a00", "#0f7c86", "#b0306a"];
  // Adults get the most frequent words early (Zipf's law): the "core" topics are drawn from the top ~450 words of spoken Croatian.
  const ADULT_ORDER = ["greet", "core1", "family", "core2", "numbers", "core3", "phrases", "core4", "questions", "verbs", "core5", "food", "time", "core6", "home", "town", "describe", "body", "nature", "colours", "animals", "clothes", "play"];
  const KID_ORDER = ["greet", "colours", "numbers", "animals", "family", "food", "body", "clothes", "play", "home", "nature"];

  // ---------- words ----------
  const WORDS = [];
  const BY_ID = {};
  const TOPIC = {};
  for (const t of C.topics) {
    TOPIC[t.id] = t;
    t.ids = [];
    t.words.forEach((w, i) => {
      const o = { id: t.id + ":" + i, topic: t.id, hr: w[0], en: w[1], pic: w[2] || "", note: w[3] || "" };
      WORDS.push(o); BY_ID[o.id] = o; t.ids.push(o.id);

  }

  const TOPIC_WORDS = WORDS.length;
  // Conversation lines are review items too, each conversation under a hidden topic ("d:<id>").
  const DIALOGUES = C.dialogues || [], DLG = {};

    DLG[d.id] = d;

      const o = { id: tid + ":" + i, topic: tid, hr, en, pic: "", note: note || "", who, line: true };
      WORDS.push(o); BY_ID[o.id] = o; TOPIC[tid].ids.push(o.id);
      return o.id;
    });
  }
  const GRAMMAR = C.grammar || [], GRAM = {};
  for (const g of GRAMMAR) GRAM[g.id] = g;
  const SOUNDS = C.sounds || [], SOUND = {};
  for (const so of SOUNDS) SOUND[so.id] = so;
  const LEX = C.lexicon || {};
  const LANDMARKS = (window.LANDMARKS || []).filter(l => l.img);
  const STORY = {};
  for (const s of C.stories) STORY[s.id] = s;

  // ---------- helpers ----------

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (a, n) => shuffle(a).slice(0, n);
  const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  const uid = () => "p" + Math.random().toString(36).slice(2, 10);
  function toast(msg) {
    const t = h("div", { class: "toast", role: "status", text: msg });
    document.body.append(t); setTimeout(() => t.remove(), 2600);
  }
  const norm = s => s.toLowerCase().replace(/[.,!?¿¡"'“”„()—–-]/g, " ").replace(/\s+/g, " ").trim();

    return d[m][n];

  // ---------- speech ----------
  let voice = null, voiceKind = "none";
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      const hr = vs.find(v => /^hr/i.test(v.lang));
      const near = vs.find(v => /^(bs|sr)/i.test(v.lang) && !/cyr/i.test(v.name));
      voice = hr || near || null;
      voiceKind = hr ? "hr" : near ? "near" : (vs.length ? "none" : "unknown");
    } catch { voiceKind = "unsupported"; }
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", () => { pickVoice(); if (view === "home") render(); }); }
  else voiceKind = "unsupported";
  // Built-in recordings (audio.js) play first; the device's voice is the backup.
  // AUDIO_ALT is the second voice, used for speaker A in conversations.
  // Clips live inside a few pack files (audio-packs.js maps text to [pack, offset, length]); plain audio.js paths also work.
  const PACKED = window.AUDIO_PACKS;
  const AUDIO = PACKED?.main || window.AUDIO || {}, AUDIO_ALT = PACKED?.alt || window.AUDIO_ALT || {};
  const hasAudio = Object.keys(AUDIO).length > 0;
  const clean = t => t.replace(/^—\s*/, "").trim();
  const player = new Audio();
  const packBuf = {}, packLoad = {}, clipUrls = new Map();
  const loadPack = p => (packLoad[p] ||= fetch(p).then(r => (r.ok ? r.arrayBuffer() : Promise.reject())).then(b => { packBuf[p] = b; }).catch(() => { delete packLoad[p]; }));

    const k = ref.join(":");

    if (pending) { pending(false); pending = null; }

  function speak(text, rate = 0.85, alt = false) {
    stopAudio();
    const t = clean(text);
    const ref = (alt && AUDIO_ALT[t]) || AUDIO[t] || AUDIO_ALT[t] || AUDIO[t.toLowerCase()];
    return new Promise(resolve => {
      pending = resolve;
      const fin = ok => { if (pending === resolve) pending = null; resolve(ok); };

        // Changing src resets playbackRate to defaultPlaybackRate, and Safari also resets it on load,
        // so set both and apply the speed again once the clip is loaded and playing.

      const src = clipUrl(ref);
      if (src) return play(src);
      loadPack(ref[0]).then(() => { if (pending !== resolve) return; const u = clipUrl(ref); u ? play(u) : deviceSpeak(text, rate, fin); });
    });
  }
  function deviceSpeak(text, rate, fin = () => {}) {
    if (!("speechSynthesis" in window)) { toast("This browser can't play speech."); fin(false); return; }

      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/^—\s*/, ""));

  }

  let micBlocked = !SR;
  // Listens once in Croatian and passes the recogniser's guesses to onText. If the browser blocks the microphone,
  // the mic is turned off for the rest of the visit and onBlocked runs instead.
  function listenOnce(status, onText, onBlocked) {
    try {
      const r = new SR(); r.lang = "hr-HR"; r.maxAlternatives = 3; r.interimResults = false;
      status.textContent = "Listening…";
      r.onresult = e => onText([...e.results[0]].map(a => a.transcript));
      r.onerror = e => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") { micBlocked = true; onBlocked(); }

      };

    } catch { micBlocked = true; onBlocked(); }
  }
  // How far the closest guess is from the target, as a share of its length (0 = exactly it).
  const heardGap = (alts, target) => Math.min(...alts.map(a => lev(loose(a), loose(target)) / Math.max(1, loose(target).length)));

  // ---------- storage ----------
  const LS_KEY = "naucimo.v1";
  let store = { profiles: {}, activeId: null };
  try { const raw = localStorage.getItem(LS_KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch {}
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {} }
  let db = null;
  const dirty = new Set(), timers = {}, chains = {};
  function saveProfile(p) {
    p.updated = Date.now();
    store.profiles[p.id] = p; saveLocal();
    if (!db) return;
    dirty.add(p.id);
    clearTimeout(timers[p.id]);
    timers[p.id] = setTimeout(() => {
      chains[p.id] = (chains[p.id] || Promise.resolve()).then(async () => {
        const cur = store.profiles[p.id]; if (!cur) return;
        try { await db.doc("profiles/" + p.id).set(JSON.parse(JSON.stringify(cur))); dirty.delete(p.id); }
        catch (e) { if (e && e.code === "invalid_argument") { db = null; toast("Progress is saved on this device only."); } }
      });
    }, 1200);
  }
  async function deleteProfile(id) {
    delete store.profiles[id];
    if (store.activeId === id) store.activeId = Object.keys(store.profiles)[0] || null;
    saveLocal();
    if (db) try { await db.doc("profiles/" + id).delete(); } catch {}
  }
  (async () => {
    try { db = await window.claude?.use?.("db"); } catch { db = null; }
    if (!db) return;
    let first = true;
    db.collection("profiles").onSnapshot(snap => {
      const remote = {};
      for (const d of snap.docs) remote[d.id] = d.data();
      for (const [id, data] of Object.entries(remote)) {
        if (dirty.has(id)) continue;
        const local = store.profiles[id];
        if (!local || (data.updated || 0) >= (local.updated || 0)) store.profiles[id] = JSON.parse(JSON.stringify(data));
      }
      for (const id of Object.keys(store.profiles)) {
        if (remote[id] || dirty.has(id)) continue;
        if (first) saveProfile(store.profiles[id]); // made on this device before syncing
        else delete store.profiles[id];
      }
      first = false;
      if (store.activeId && !store.profiles[store.activeId]) store.activeId = null;
      saveLocal();
      if (!session && ["home", "learn", "family", "profiles"].includes(view)) render();
    }, () => { db = null; });
  })();

  // ---------- profile + SRS ----------
  const me = () => store.profiles[store.activeId] || null;
  const isKid = () => me()?.kind === "kid";
  function newProfile(name, kind) {
    const n = Object.keys(store.profiles).length;
    return { id: uid(), name, kind, color: COLORS[n % COLORS.length], xp: 0, days: {}, streak: 0, last: 0, srs: {}, stories: {}, created: Date.now() };
  }
  function addXp(p, n) {
    if (!n) return;
    const t = today();
    p.xp = (p.xp || 0) + n;
    p.days = p.days || {};
    p.days[t] = (p.days[t] || 0) + n;
    for (const k of Object.keys(p.days)) if (+k < t - 30) delete p.days[k];
    if (p.last !== t) p.streak = p.last === t - 1 ? (p.streak || 0) + 1 : 1;

  function nextState(s, grade) {
    let [e, i, , r] = s || [2.5, 0, 0, 0];
    if (grade === 0) { e = Math.max(1.3, e - 0.2); i = 0; r = Math.max(r, 1); }

        mic.onclick = () => listenOnce(status, alts => {

          if (heardGap(alts, w.hr) <= 0.25) answer(ex, true, h("span", null, "Great pronunciation."), { silent: true });
          else status.textContent += ". Try again, or rate yourself below.";
        }, () => { mic.remove(); status.textContent = "The microphone isn't available here, so rate yourself."; });
        stage.append(h("div", { class: "row center" }, mic));
      }
      stage.append(status);
      const sheet = h("div", { class: "sheet" }, h("div", { class: "in" }, h("div", { class: "row" },
        h("button", { class: "btn", style: "flex:1", onclick: () => { sheet.remove(); answer(ex, false, h("span", null, "We'll practise it again."), { silent: true }); } }, "Not yet"),
        h("button", { class: "btn primary", style: "flex:2", id: "continue", onclick: () => { sheet.remove(); answer(ex, true, null, { silent: true }); } }, kid ? "I said it! ⭐" : "I said it"))));
      app.append(sheet);
      speak(w.hr);
    },
    flash(ex, stage) {
      const w = ex.w, p = me();
      const back = h("div", { hidden: true, style: "display:grid;gap:8px;justify-items:center" }, h("div", { class: ex.reverse ? "big" : "en", text: ex.reverse ? w.hr : w.en }), w.note ? h("div", { class: "note", text: w.note }) : null);
      stage.append(h("div", { class: "prompt-label", text: ex.reverse ? "Say it in Croatian, out loud, then check" : "Do you remember this?" }),
        h("div", { class: "card" }, isKid() && w.pic ? h("div", { class: "bigpic", text: w.pic }) : null, h("div", { class: "big", text: ex.reverse ? w.en : w.hr }), back,
          ex.reverse ? null : h("div", { class: "row center" }, sayBtn(w.hr))));
      if (ex.reverse) back.append(sayBtn(w.hr));
      const s = p.srs[w.id];
      const rate = h("div", { class: "rate" }, [["Again", 0, "again"], ["Hard", 1, ""], ["Good", 2, "good"], ["Easy", 3, ""]].map(([label, g, cls]) => {
        const nxt = nextState(s, g);
        return h("button", { class: "btn " + cls, onclick: () => {
          p.srs[w.id] = nxt;
          if (g === 0) { session.wrong[w.id] = 1; if (!ex.retry) session.queue.push(Object.assign({}, ex, { retry: true })); }
          else { session.right++; session.xp += 5; }
          session.idx++; render();
        } }, label, h("small", { text: ivlLabel(nxt[1]) }));
      }));
      const reveal = h("button", { class: "btn primary", id: "continue", onclick: () => { back.hidden = false; reveal.replaceWith(rate); speak(w.hr); } }, "Show answer");
      app.append(h("div", { class: "sheet" }, h("div", { class: "in" }, reveal)));
      if (!ex.reverse) speak(w.hr);
    },
    match(ex, stage) {
      const words = ex.words;
      stage.append(h("div", { class: "prompt-label", text: "Match each picture to its word" }));
      const left = shuffle(words), right = shuffle(words);
      const grid = h("div", { class: "match" });
      let sel = null, left_n = words.length, misses = 0;
      const tiles = [];
      for (let i = 0; i < words.length; i++) {
        tiles.push(h("button", { class: "mt pic", "data-id": left[i].id, "data-side": "p", "aria-label": "Picture", text: left[i].pic }));
        tiles.push(h("button", { class: "mt", "data-id": right[i].id, "data-side": "w", text: right[i].hr }));
      }
      tiles.forEach(t => {
        t.onclick = () => {
          if (t.dataset.side === "w") speak(t.textContent);
          if (!sel || sel.dataset.side === t.dataset.side) { if (sel) sel.classList.remove("sel"); sel = t; t.classList.add("sel"); return; }
          if (sel.dataset.id === t.dataset.id) {
            sel.classList.add("gone"); t.classList.add("gone"); sel = null; left_n--;
            if (!left_n) { session.right = words.length; session.xp = Math.max(5, 15 - misses * 2); session.idx++; setTimeout(render, 400); }
          } else {
            misses++; const a = sel; a.classList.remove("sel"); [a, t].forEach(x => { x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 350); }); sel = null;
          }
        };
        grid.append(t);
      });
      stage.append(grid);
    }
  };

  function applyLesson(s, p) {
    const t = today();
    for (const id of s.fresh || []) p.srs[id] = s.wrong[id] ? [2.3, 0, t, 0] : [2.5, 1, t + 1, 1];
    for (const id of s.review || []) if (s.wrong[id]) { const [e, , , r] = p.srs[id]; p.srs[id] = [Math.max(1.3, e - 0.2), 0, t, r]; }
  }
  function finish(early) {
    const s = session, p = me();
    if (s.kind === "daily" && early) { saveRun(s); return go("home"); } // resumes from here next time
    if (p) {
      if (s.kind === "lesson" || s.kind === "daily") {
        if (early) { // keep only words that were actually practised
          const seen = new Set(s.queue.slice(0, s.idx).map(e => e.w?.id));
          s.fresh = s.fresh.filter(id => seen.has(id)); s.review = s.review.filter(id => seen.has(id));
        }
        applyLesson(s, p);
      }
      if (s.kind === "daily") {
        const t = today(), pl = planOf(p);
        // Words from last time that came back move on in the schedule (misses were reset above).
        for (const id of s.warm) if (!s.wrong[id] && p.srs[id] && p.srs[id][2] <= t) p.srs[id] = nextState(p.srs[id], 2);
        delete p.run;
        {
          // Relearned words are asked for again tomorrow.
          for (const id of s.relearn) if (p.srs[id]) { const [e, , , r] = p.srs[id]; p.srs[id] = [Math.max(1.3, e - 0.2), 1, t + 1, r]; }
          pl.clean = pl.clean || {};
          const gm = k => Object.keys(s.wrong).some(x => x.startsWith("g:" + k + ":"));
          s.slow = !!(s.timed && s.speed?.[1] && s.speed[0] / s.speed[1] < 2 / 3);
          if (s.unit && !gm(s.unit) && !s.slow) pl.clean[s.unit] = (pl.clean[s.unit] || 0) + 1;
          if (s.plan.warmUnit && gm(s.plan.warmUnit.id)) pl.clean[s.plan.warmUnit.id] = 0;
          pl.day = s.day; pl.date = t; pl.unit = s.unit || null;
          pl.last = { fresh: [...s.relearn, ...s.fresh], unit: s.unit || null };
        }
      }
      if (!early) finishExtras(s, p);
      addXp(p, s.xp); saveProfile(p);
    }
    if (early) go("home");
  }
  // Progress for conversations, grammar and ear training (only when a session is completed).
  function finishExtras(s, p) {
    const t = today(), misses = pre => Object.entries(s.wrong).filter(([k]) => k.startsWith(pre)).reduce((a, [, v]) => a + v, 0);
    if (s.dlg) {
      p.dlg = p.dlg || {}; p.dlg[s.dlg] = true;
      if (s.kind === "roleplay") for (const id of new Set(s.queue.map(e => e.w.id))) if (!p.srs[id]) p.srs[id] = s.wrong[id] ? [2.3, 0, t, 0] : [2.5, 1, t + 1, 1];
    }
    if (s.unit) {
      p.gram = p.gram || {};
      const m = misses("g:" + s.unit + ":"), grade = m === 0 ? (s.kind === "speed" ? 3 : 2) : m <= 2 ? 1 : 0;
      const cur = p.gram[s.unit];
      p.gram[s.unit] = cur ? nextState(cur, grade) : grade ? [2.5, 1, t + 1, 1] : [2.3, 0, t, 0];
      if (s.kind === "daily" && s.queue.some(e => e.type === "rule" && e.g?.id === s.unit)) (p.ruleRev = p.ruleRev || {})[s.unit] = GRAM[s.unit].rev || 1;
    }
    for (const u of s.units || []) { const m = misses("g:" + u + ":"); p.gram[u] = nextState(p.gram[u], m ? (m > 1 ? 0 : 1) : 2); }
    if (s.kind === "ear") { p.snd = p.snd || {}; p.snd[s.sound] = Math.max(p.snd[s.sound] || 0, s.right / Math.max(1, s.queue.length)); }
  }
  let finishedSession = null;
  function finishScreen(stage) {
    const s = session;
    if (finishedSession !== s) { finishedSession = s; finish(false); }
    document.querySelectorAll(".sheet").forEach(x => x.remove());
    const kid = isKid(), p = me();
    const total = s.kind === "match" ? s.right : s.queue.filter(e => !["intro", "gate", "rule", "story", "quick"].includes(e.type)).length;
    stage.append(h("div", { class: "done" },
      h("div", { class: "bigpic", text: kid ? "🌟" : "🎉" }),
      h("h2", { text: kid ? "Bravo!" : "Odlično! " + s.title + " done." }),
      h("div", { class: "stats" },
        h("span", null, kid ? "⭐ " : "", h("b", { text: "+" + s.xp }), kid ? " stars" : " XP"),
        s.kind !== "match" ? h("span", null, h("b", { text: s.right + " / " + total }), " correct") : null,
        p ? h("span", null, "🔥 ", h("b", { text: streakOf(p) }), " day streak") : null),
      s.kind === "daily" && (s.read || s.quick) ? h("p", { text: [s.read ? "Story: “" + STORY[s.read.id].hr + "”, " + s.read.right + " of " + s.read.of + " questions right." : "",
        s.quick ? "Quick round: " + s.quick.score + (s.quick.score > s.quick.best && s.quick.best ? " (a new best)." : ".") : ""].filter(Boolean).join(" ") }) : null,
      s.kind === "daily" && s.slow ? h("p", { text: "Grammar: your answers were right, but " + (s.speed[1] - s.speed[0]) + " of " + s.speed[1] + " were slow, so today doesn't count as a clean day for " + GRAM[s.unit].en.split(":")[0] + " yet. It moves on after two days that are right and quick." }) : null,
      s.kind === "daily" ? h("p", { text: ([...s.relearn, ...s.fresh].length ? "Tomorrow starts by asking for " + [...s.relearn, ...s.fresh].map(id => BY_ID[id].hr).join(", ") + " from memory. New words unlock only if they all come back. " : "") + "The next lesson opens tomorrow." }) : null,
      s.kind === "lesson" && s.fresh.length ? h("p", { text: "New words: " + s.fresh.map(id => BY_ID[id].hr).join(", ") + ". They'll come back for review tomorrow." }) : null,
      h("div", { class: "actions", style: "width:100%" },
        s.kind === "match" ? h("button", { class: "btn primary", onclick: () => { session = null; startMatch(); } }, "Play again") : null,
        s.next ? h("button", { class: "btn primary", onclick: () => { session = null; s.next[1](); } }, s.next[0]) : null,
        h("button", { class: "btn", onclick: () => go("home") }, "Home"))));
  }

  document.addEventListener("keydown", e => {
    if (!session) return;
    if (e.key === "Enter" && document.activeElement?.id !== "typed") { const c = $("#continue"); if (c && document.activeElement !== c) { e.preventDefault(); c.click(); } }
  });

  render();
  // Fetch the audio packs in the background so taps play straight away.
  if (PACKED) setTimeout(() => PACKED.packs.reduce((ch, p) => ch.then(() => loadPack(p)), Promise.resolve()), 800);
})();
</script>
